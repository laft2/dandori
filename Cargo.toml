[workspace]
resolver = "3"
members = ["crates/dandori-core", "crates/dandori-cli", "crates/dandori-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/OWNER/dandori"

[workspace.dependencies]
dandori-core = { path = "crates/dandori-core" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
